version: '3.8'

services:
  # PHP Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tierforge-app
    container_name: tierforge-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - tierforge-network

  # Nginx Service
  web:
    image: nginx:alpine
    container_name: tierforge-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - tierforge-network
    depends_on:
      - app

  # PostgreSQL Service
  db:
    image: postgres:16-alpine
    container_name: tierforge-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - tierforge-db-data:/var/lib/postgresql/data
    networks:
      - tierforge-network

  # Redis Service
  redis:
    image: redis:alpine
    container_name: tierforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - tierforge-network

  # Meilisearch Service
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: tierforge-search
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:-masterKey}
    volumes:
      - tierforge-search-data:/meili_data
    networks:
      - tierforge-network

  # Horizon Service (Queues)
  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    image: tierforge-app
    container_name: tierforge-horizon
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan horizon
    volumes:
      - ./:/var/www
    networks:
      - tierforge-network
    depends_on:
      - app
      - redis
      - db

  # Reverb Service (WebSockets)
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    image: tierforge-app
    container_name: tierforge-reverb
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8081:8080"
    volumes:
      - ./:/var/www
    networks:
      - tierforge-network
    depends_on:
      - app
      - redis

networks:
  tierforge-network:
    driver: bridge

volumes:
  tierforge-db-data:
    driver: local
  tierforge-search-data:
    driver: local
